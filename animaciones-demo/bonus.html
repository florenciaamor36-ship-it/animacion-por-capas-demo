<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Demo 03 · Bonus de trébol</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{min-height:100vh;display:grid;place-items:center;padding:52px 14px 22px;background:transparent;color:#e8e4d8}.back{position:fixed;z-index:3;top:14px;left:14px;color:inherit;text-decoration:none;font-weight:700;padding:9px 13px;background:transparent}.stage{width:min(100%,760px);display:flex;flex-direction:column;align-items:center;gap:16px}.scene{width:min(100%,700px);aspect-ratio:700/600;position:relative;overflow:hidden;background:transparent;touch-action:manipulation}.scene canvas{display:block;width:100%;height:100%;background:transparent;touch-action:manipulation}.btn{border:1px solid #d8a93b;color:#f4d77d;background:transparent;padding:12px 25px;border-radius:999px;font-size:1rem;font-weight:800;letter-spacing:.04em;cursor:pointer;touch-action:manipulation}.hint{margin:0;text-align:center;color:#c7c0a6;font-size:.9rem}
</style>
</head>
<body><a class="back" href="../index.html">← Índice</a><main class="stage"><div class="scene"><canvas id="bonusCanvas" width="700" height="600" aria-label="Animación bonus con el arte enviado"></canvas></div><button class="btn" id="replayBtn">¡Activar bonus!</button><p class="hint">Medallón, tréboles, letras y monedas recortados de tu imagen.</p></main>
<script>
(()=>{'use strict';const canvas=document.getElementById('bonusCanvas'),ctx=canvas.getContext('2d',{alpha:true}),button=document.getElementById('replayBtn');const W=700,H=600;const sprite=new Image();sprite.src='bonus-sheet.png?v=full1024-3';let t=0,last=0,playing=false,coins=[],raf=0;const crop={med:{x:326,y:68,w:374,h:370},bonus:{x:358,y:458,w:312,h:78},clovers:[{x:25,y:432,w:133,h:112},{x:170,y:439,w:89,h:103},{x:691,y:441,w:90,h:103},{x:794,y:442,w:84,h:96}],coinFrames:[{x:24,y:21,w:53,h:54},{x:84,y:79,w:53,h:54},{x:145,y:21,w:53,h:54},{x:206,y:79,w:53,h:54},{x:267,y:21,w:53,h:54},{x:704,y:21,w:53,h:54},{x:765,y:79,w:53,h:54},{x:826,y:21,w:53,h:54},{x:887,y:79,w:53,h:54},{x:948,y:21,w:53,h:54},{x:24,y:314,w:53,h:54},{x:84,y:314,w:53,h:54},{x:145,y:314,w:53,h:54},{x:206,y:314,w:53,h:54},{x:267,y:314,w:53,h:54},{x:704,y:314,w:53,h:54},{x:765,y:314,w:53,h:54},{x:826,y:314,w:53,h:54},{x:887,y:314,w:53,h:54},{x:948,y:314,w:53,h:54}]};
function resize(){const dpr=Math.min(devicePixelRatio||1,2),r=canvas.getBoundingClientRect();canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0)}addEventListener('resize',resize,{passive:true});resize();
const easeOut=t=>1-Math.pow(1-t,3),bounce=t=>{const n=7.5625,d=2.75;if(t<1/d)return n*t*t;if(t<2/d){t-=1.5/d;return n*t*t+.75}if(t<2.5/d){t-=2.25/d;return n*t*t+.9375}t-=2.625/d;return n*t*t+.984375};
class Coin{constructor(i){this.delay=i*12+Math.random()*140;const a=Math.random()*Math.PI*2;this.x=350+Math.cos(a)*150;this.y=250+Math.sin(a)*145;const speed=125+Math.random()*270;this.vx=Math.cos(a)*speed;this.vy=Math.sin(a)*speed-100;this.g=660;this.frame=Math.floor(Math.random()*crop.coinFrames.length);this.r=21+Math.random()*24;this.angle=Math.random()*6.28;this.spin=(Math.random()-.5)*11;this.life=2.3+Math.random()*1.4;this.age=0;this.alpha=1}update(dt){const sec=dt/1000;if(this.delay>0){this.delay-=dt;return}this.age+=sec;this.vy+=this.g*sec;this.x+=this.vx*sec;this.y+=this.vy*sec;this.angle+=this.spin*sec;if(this.y>552){this.y=552;this.vy=-Math.abs(this.vy)*.32;this.vx*=.78}this.alpha=Math.max(0,Math.min(1,(this.life-this.age)*1.3));if(this.age>this.life)this.alpha=0}draw(){if(this.delay>0||!this.alpha)return;const c=crop.coinFrames[this.frame];ctx.save();ctx.globalAlpha=this.alpha;ctx.translate(this.x,this.y);ctx.rotate(this.angle*.22);ctx.scale(Math.max(.12,Math.abs(Math.cos(this.angle))),1);ctx.drawImage(sprite,c.x,c.y,c.w,c.h,-this.r/2,-this.r/2,this.r,this.r);ctx.restore()}}
function start(){if(!sprite.complete||!sprite.naturalWidth)return;playing=true;t=0;coins=Array.from({length:46},(_,i)=>new Coin(i));if(!raf){last=performance.now();raf=requestAnimationFrame(loop)}}function image(cropData,x,y,w,h,scale=1,angle=0,alpha=1){ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);ctx.rotate(angle);ctx.scale(scale,scale);ctx.drawImage(sprite,cropData.x,cropData.y,cropData.w,cropData.h,-w/2,-h/2,w,h);ctx.restore()}
function loop(now){const dt=Math.min(32,now-last||16.667);last=now;if(playing)t+=dt/1000;ctx.clearRect(0,0,W,H);
// Large medallion grows in with a soft elastic overshoot, using the exact crop from the supplied sheet.
const mp=Math.min(1,t/.62),ms=mp<1?bounce(mp):1;image(crop.med,350,250,360,360,ms,mp<1?Math.sin(t*9)*.025*(1-mp):0,Math.min(1,mp*2));
// Side clovers pop in behind the BONUS lettering, all sampled from the attached image.
const cp=Math.max(0,Math.min(1,(t-.52)/.55)),cs=cp<1?bounce(cp):1;image(crop.clovers[0],145,345,82,72,cs,Math.sin(now*.0012)*.035,cp);image(crop.clovers[2],555,345,82,72,cs,Math.sin(now*.0011+1)*.035,cp);image(crop.clovers[1],95,451,56,54,Math.min(1,cs*.88),-.08,cp);image(crop.clovers[3],605,451,56,54,Math.min(1,cs*.88),.08,cp);
for(let i=coins.length-1;i>=0;i--){coins[i].update(dt);coins[i].draw();if(coins[i].alpha<=0)coins.splice(i,1)}
const bp=Math.max(0,Math.min(1,(t-.66)/.48)),bs=bp<1?bounce(bp):1;image(crop.bonus,350,480,330,84,bs,Math.sin(now*.0014)*.012*(1-bp),bp);
if(t>3&&coins.length===0){playing=false}if(playing||coins.length){raf=requestAnimationFrame(loop)}else{raf=0;ctx.clearRect(0,0,W,H);image(crop.med,350,250,360,360,1,0,1);image(crop.clovers[0],145,345,82,72);image(crop.clovers[2],555,345,82,72);image(crop.clovers[1],95,451,56,54);image(crop.clovers[3],605,451,56,54);image(crop.bonus,350,480,330,84)}}
sprite.onload=()=>{start()};sprite.onerror=()=>{document.querySelector('.hint').textContent='No se pudo cargar la imagen del bonus.'};button.addEventListener('click',start);canvas.addEventListener('click',start);setTimeout(()=>{if(sprite.complete&&sprite.naturalWidth)start();else document.querySelector('.hint').textContent='Cargando arte del bonus…'},0)})();
</script></body></html>
