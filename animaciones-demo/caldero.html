<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Demo 01 · Caldero mágico</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}body{display:flex;justify-content:center;align-items:center;min-height:100vh;min-height:100dvh}
#escena{position:relative;width:min(100vw,calc(100dvh * 1024 / 558));height:min(100dvh,calc(100vw * 558 / 1024));aspect-ratio:1024/558;overflow:hidden;background:transparent;isolation:isolate}
#fondo{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:0}
#caldero{position:absolute;left:34.18%;top:16.13%;width:31.84%;height:75.09%;z-index:1;object-fit:fill;pointer-events:none}
#capa-animacion{position:absolute;inset:0;width:100%;height:100%;background:transparent;pointer-events:none;z-index:2}
</style>
</head>
<body>
<div id="escena" aria-label="Caldero con animación transparente de burbujas, humo y chispas">
<img id="caldero" src="../cauldron-cutout.png" alt="">
<canvas id="capa-animacion" width="1024" height="558"></canvas>
</div>
<script>
const canvas=document.getElementById('capa-animacion');
const ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height;
const bubbles=[],smoke=[],fireSparks=[];
// Puntos de emisión medidos respecto de la imagen original 1024×558.
const centerX=512,liquidY=229,fireY=449;
for(let i=0;i<90;i++)bubbles.push({x:centerX+(Math.random()-.5)*210,y:liquidY+Math.random()*34,radius:Math.random()*7+3,speedY:Math.random()*1.45+.65,speedX:(Math.random()-.5)*.65,alpha:Math.random()*.85+.15,color:['rgba(50,255,120,','rgba(230,80,255,','rgba(255,220,90,'][Math.floor(Math.random()*3)]});
for(let i=0;i<48;i++)smoke.push({x:centerX+(Math.random()-.5)*170,y:liquidY-16+Math.random()*40,radius:Math.random()*25+18,speedY:Math.random()*.95+.45,speedX:(Math.random()-.5)*.75,alpha:Math.random()*.38+.18});
for(let i=0;i<75;i++)fireSparks.push({x:centerX+(Math.random()-.5)*210,y:fireY+Math.random()*24,radius:Math.random()*4+1.5,speedY:Math.random()*2.4+1.1,speedX:(Math.random()-.5)*1.05,alpha:1});
function animate(){ctx.clearRect(0,0,W,H);
// Reflejo y lenguas de fuego bajo el caldero: intensidad animada, sin tapar la olla.
const firePulse=.82+.18*Math.sin(performance.now()*.018);
const fireGlow=ctx.createRadialGradient(centerX,fireY+18,4,centerX,fireY+18,155);
fireGlow.addColorStop(0,`rgba(255,215,65,${.42*firePulse})`);fireGlow.addColorStop(.4,`rgba(255,92,18,${.32*firePulse})`);fireGlow.addColorStop(1,'rgba(255,30,0,0)');ctx.fillStyle=fireGlow;ctx.fillRect(centerX-160,fireY-30,320,125);
for(let i=0;i<17;i++){const x=centerX-112+i*14,phase=performance.now()*.008+i*1.7,height=22+Math.abs(Math.sin(phase))*58;ctx.beginPath();ctx.moveTo(x-8,fireY+19);ctx.quadraticCurveTo(x-13+Math.sin(phase)*8,fireY-height*.35,x+Math.sin(phase*1.4)*10,fireY-height);ctx.quadraticCurveTo(x+14+Math.cos(phase)*7,fireY-height*.35,x+8,fireY+19);ctx.closePath();const flame=ctx.createLinearGradient(0,fireY-height,0,fireY+20);flame.addColorStop(0,'rgba(255,245,130,.12)');flame.addColorStop(.35,`rgba(255,175,35,${.55*firePulse})`);flame.addColorStop(1,`rgba(255,50,5,${.72*firePulse})`);ctx.fillStyle=flame;ctx.fill();}
// Humo detrás del caldero: la zona de salida queda en el borde interno de la boca.
smoke.forEach(s=>{ctx.beginPath();const g=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.radius);g.addColorStop(0,`rgba(205,220,225,${s.alpha})`);g.addColorStop(.48,`rgba(155,170,185,${s.alpha*.68})`);g.addColorStop(1,'rgba(120,135,155,0)');ctx.fillStyle=g;ctx.arc(s.x,s.y,s.radius,0,Math.PI*2);ctx.fill();s.y-=s.speedY;s.x+=s.speedX;s.radius+=.42;s.alpha-=.0022;if(s.alpha<=0){s.x=centerX+(Math.random()-.5)*170;s.y=liquidY+8;s.radius=Math.random()*22+18;s.alpha=Math.random()*.38+.18}});
// Burbujas mágicas nacen dentro del líquido y suben por la abertura.
bubbles.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,b.radius,0,Math.PI*2);ctx.fillStyle=b.color+b.alpha+')';ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle='rgba(255,255,255,.6)';ctx.stroke();b.y-=b.speedY;b.x+=b.speedX;b.alpha-=.005;if(b.alpha<=0||b.y<liquidY-145){b.x=centerX+(Math.random()-.5)*190;b.y=liquidY+22;b.radius=Math.random()*7+3;b.alpha=Math.random()*.9+.1;b.color=['rgba(50,255,120,','rgba(230,80,255,','rgba(255,220,90,'][Math.floor(Math.random()*3)]}});
// Chispas suben desde el fuego visible debajo de la base de piedra.
fireSparks.forEach(f=>{ctx.beginPath();const glow=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.radius*2.8);glow.addColorStop(0,`rgba(255,255,190,${f.alpha})`);glow.addColorStop(.35,`rgba(255,190,45,${f.alpha})`);glow.addColorStop(1,'rgba(255,65,10,0)');ctx.fillStyle=glow;ctx.arc(f.x,f.y,f.radius*2.8,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(f.x,f.y,f.radius,0,Math.PI*2);ctx.fillStyle=`rgba(255,220,100,${f.alpha})`;ctx.fill();f.y-=f.speedY;f.x+=f.speedX;f.alpha-=.015;if(f.alpha<=0){f.x=centerX+(Math.random()-.5)*210;f.y=fireY+24;f.radius=Math.random()*4+1.5;f.speedY=Math.random()*2.4+1.1;f.alpha=1}});
requestAnimationFrame(animate)}
animate();
</script>
</body>
</html>
