<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Demo 04 · Duendesita animada</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{min-height:100vh;display:grid;place-items:center;padding:54px 14px 24px;background:transparent;color:#f5f0e4}.back{position:fixed;top:14px;left:14px;color:inherit;text-decoration:none;font-weight:700;padding:9px 13px}.stage{width:min(100%,660px);display:flex;flex-direction:column;align-items:center;gap:14px}.scene{width:min(100%,540px);height:min(64vh,540px);min-height:330px;display:grid;place-items:center;background:transparent}.scene canvas{width:100%;height:100%;display:block;background:transparent;touch-action:manipulation}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}.btn{border:1px solid #d3ae62;color:#f4d77d;background:#201e17cc;padding:11px 18px;border-radius:999px;font-size:.95rem;font-weight:800;cursor:pointer}.btn[aria-pressed="true"]{background:#4b3a18}.hint{margin:0;text-align:center;color:#c7c0a6;font-size:.9rem;line-height:1.5}
</style>
</head>
<body><a class="back" href="../index.html">← Índice</a><main class="stage"><div class="scene"><canvas id="c" aria-label="Duendesita animada con fotogramas recortados de la imagen original"></canvas></div><div class="controls"><button class="btn" id="walk" aria-pressed="true">Reiniciar animación</button></div><p class="hint" id="hint">Loop con las siete poses de arriba de tu lámina. Fondo transparente.</p></main>
<script>
(()=>{'use strict';const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),hint=document.getElementById('hint'),walk=document.getElementById('walk'),turn=document.getElementById('turn'),bonus=document.getElementById('bonus');
const files=Array.from({length:7},(_,i)=>`duendesita/frames/frame_${String(i+1).padStart(2,'0')}.png`),frames=files.map(src=>{const im=new Image();im.src=src;im.onerror=()=>hint.textContent='No se pudo cargar un fotograma.';return im});
let dpr=1,w=0,h=0,index=0,last=0,elapsed=0,raf=0;
function size(){const r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.max(1,Math.round(r.width*dpr));canvas.height=Math.max(1,Math.round(r.height*dpr));w=r.width;h=r.height;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',size,{passive:true});size();
function restart(){index=0;elapsed=0;if(!raf){last=performance.now();raf=requestAnimationFrame(loop)}}walk.onclick=restart;function drawFrame(i){const im=frames[i];if(!im.complete||!im.naturalWidth)return;ctx.clearRect(0,0,w,h);const maxW=w*.76,maxH=h*.9,scale=Math.min(maxW/im.naturalWidth,maxH/im.naturalHeight);const dw=im.naturalWidth*scale,dh=im.naturalHeight*scale;ctx.drawImage(im,(w-dw)/2,(h-dh)/2,dw,dh)}
function loop(now){const dt=Math.min(80,now-last||16);last=now;elapsed+=dt;if(elapsed>155){elapsed=0;index=(index+1)%frames.length}drawFrame(index);raf=requestAnimationFrame(loop)}
Promise.all(frames.map(im=>im.decode().catch(()=>{}))).then(()=>{hint.textContent='Loop con las siete poses de arriba de tu lámina. Fondo transparente.';raf=requestAnimationFrame(loop)});
})();
</script></body></html>
