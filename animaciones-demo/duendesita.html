<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Demo 04 · Duendesita animada</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{min-height:100vh;display:grid;place-items:center;padding:54px 14px 24px;background:transparent;color:#f5f0e4}.back{position:fixed;top:14px;left:14px;color:inherit;text-decoration:none;font-weight:700;padding:9px 13px}.stage{width:min(100%,520px);display:flex;flex-direction:column;align-items:center;gap:14px}.scene{width:240px;height:300px;display:grid;place-items:center;background:transparent}.scene img{display:block;width:84px;height:157px;object-fit:contain;image-rendering:auto}.btn{border:1px solid #d3ae62;color:#f4d77d;background:#201e17cc;padding:11px 18px;border-radius:999px;font-size:.95rem;font-weight:800;cursor:pointer}.hint{margin:0;text-align:center;color:#c7c0a6;font-size:.9rem;line-height:1.5}
</style>
</head>
<body><a class="back" href="../index.html">← Índice</a><main class="stage"><div class="scene"><img id="figure" src="duendesita/duendesita-animacion.gif?v=once-small1" alt="Duendesita, animación de siete poses en una sola reproducción"></div><button class="btn" id="play">Reproducir de nuevo</button><p class="hint" id="hint">Una sola reproducción, más chica para disimular el pixelado. Al terminar queda en la última pose.</p></main>
<script>(()=>{'use strict';const im=document.getElementById('figure'),btn=document.getElementById('play');let seed=1;btn.addEventListener('click',()=>{seed++;im.src='duendesita/duendesita-animacion.gif?v=once-small'+seed})})();</script></body></html>
