<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Demo 04 · Duendesita animada</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{min-height:100vh;display:grid;place-items:center;padding:54px 14px 24px;background:transparent;color:#f5f0e4}.back{position:fixed;top:14px;left:14px;color:inherit;text-decoration:none;font-weight:700;padding:9px 13px}.stage{width:min(100%,520px);display:flex;flex-direction:column;align-items:center;gap:14px}.scene{width:260px;height:320px;display:grid;place-items:center;background:transparent}.scene img{display:block;max-width:120px;max-height:270px;width:auto;height:auto;object-fit:contain;image-rendering:auto}.btn{border:1px solid #d3ae62;color:#f4d77d;background:#201e17cc;padding:11px 18px;border-radius:999px;font-size:.95rem;font-weight:800;cursor:pointer}.hint{margin:0;text-align:center;color:#c7c0a6;font-size:.9rem;line-height:1.5}
</style>
</head>
<body><a class="back" href="../index.html">← Índice</a><main class="stage"><div class="scene"><img id="figure" src="duendesita/frames/frame_01.png?v=still-smaller-1" alt="Duendesita, primer fotograma de la animación"></div><button class="btn" id="play">Reproducir de nuevo</button><p class="hint" id="hint">Se reproduce una sola vez; queda quieta al terminar. Tamaño reducido para disimular el pixelado.</p></main>
<script>
(()=>{'use strict';const img=document.getElementById('figure'),button=document.getElementById('play'),hint=document.getElementById('hint');const urls=Array.from({length:7},(_,i)=>`duendesita/frames/frame_${String(i+1).padStart(2,'0')}.png?v=still-smaller-${i+1}`);let timer=null,idx=0;const ready=urls.map(url=>new Promise(resolve=>{const frame=new Image();frame.onload=()=>resolve(true);frame.onerror=()=>resolve(false);frame.src=url}));function play(){if(timer){clearInterval(timer);timer=null}idx=0;img.src=urls[0];hint.textContent='Reproducción única en curso…';timer=setInterval(()=>{idx++;img.src=urls[idx];if(idx>=urls.length-1){clearInterval(timer);timer=null;hint.textContent='Terminó. Quedó en la última pose; tocá el botón para verla de nuevo.'}},150)}button.addEventListener('click',play);Promise.all(ready).then(ok=>{if(ok.every(Boolean)){img.src=urls[0];play()}else hint.textContent='No se pudieron cargar todos los fotogramas.'})})();
</script></body></html>
