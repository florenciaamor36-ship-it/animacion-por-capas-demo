<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Demo 02 · Galera animada</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{min-height:100vh;display:grid;place-items:center;padding:52px 14px 22px;background:transparent;color:#24312a}.back{position:fixed;z-index:3;top:14px;left:14px;color:#24312a;text-decoration:none;font-weight:700;background:transparent;padding:9px 13px;border-radius:999px;box-shadow:none}.container{display:flex;flex-direction:column;align-items:center;gap:14px;width:min(100%,680px)}.scene{position:relative;width:min(100%,620px);aspect-ratio:1024/559;overflow:visible;isolation:isolate}.character{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform-origin:50% 82%;user-select:none;-webkit-user-drag:none;filter:none}.character.play{animation:jump .92s cubic-bezier(.22,.72,.3,1) both}@keyframes jump{0%{transform:translateY(0) scale(1,1)}12%{transform:translateY(8px) scale(1.055,.92)}34%{transform:translateY(-46px) scale(.96,1.08) rotate(-2deg)}58%{transform:translateY(-25px) scale(1.02,.98) rotate(2deg)}78%{transform:translateY(3px) scale(1.04,.94)}90%{transform:translateY(-8px) scale(.99,1.03)}100%{transform:translateY(0) scale(1,1)}}.particles{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.btn{background:transparent;color:#24312a;border:1px solid #27ae60;padding:14px 28px;font-size:1.05rem;font-weight:800;border-radius:999px;box-shadow:none;cursor:pointer;touch-action:manipulation}.btn:active{transform:translateY(1px)}.hint{margin:0;text-align:center;color:#59655d;font-size:.95rem}.caption{margin:4px 0 0;text-align:center;color:#7b837c;font-size:.8rem}@media(prefers-reduced-motion:reduce){.character.play{animation-duration:1.2s}}
</style>
</head>
<body>
<a class="back" href="../index.html">← Índice</a>
<main class="container">
<div class="scene" id="scene" aria-label="Imagen original de la galera de la suerte animada">
<img class="character" id="character" src="galera-original.png" alt="Galera verde de la suerte con ojos, trébol y monedas" draggable="false">
<canvas class="particles" id="particles" aria-hidden="true"></canvas>
</div>
<button class="btn" id="triggerBtn" type="button">¡Girar / Animar!</button>
<p class="hint">Tocá la galera o el botón para hacerla saltar y lanzar monedas.</p>
<p class="caption">Se anima la imagen original que enviaste.</p>
</main>
<script>
(()=>{'use strict';const scene=document.getElementById('scene'),img=document.getElementById('character'),canvas=document.getElementById('particles'),ctx=canvas.getContext('2d'),button=document.getElementById('triggerBtn');const W=1024,H=559;let coins=[],sparkles=[],raf=0,playing=false,last=0;
function size(){const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',size,{passive:true});size();
class Coin{constructor(){this.x=510+(Math.random()-.5)*320;this.y=135+Math.random()*70;this.vx=(Math.random()-.5)*8;this.vy=-(Math.random()*7+5);this.radius=9+Math.random()*9;this.angle=Math.random()*6.28;this.spin=(Math.random()-.5)*.3;this.alpha=1;this.gravity=.24;this.bounce=.46;this.floor=H-10}update(dt){const t=dt/16.667;this.vy+=this.gravity*t;this.x+=this.vx*t;this.y+=this.vy*t;this.angle+=this.spin*t;if(this.y+this.radius>this.floor){this.y=this.floor-this.radius;this.vy*=-this.bounce;this.vx*=.88;if(Math.abs(this.vy)<1.1){this.vy=0;this.alpha-=.018*t}}}draw(){if(this.alpha<=0)return;ctx.save();ctx.globalAlpha=this.alpha;ctx.translate(this.x,this.y);ctx.scale(Math.max(.08,Math.abs(Math.cos(this.angle))),1);const g=ctx.createLinearGradient(-this.radius,-this.radius,this.radius,this.radius);g.addColorStop(0,'#fff0a0');g.addColorStop(.48,'#f3c52d');g.addColorStop(1,'#a96a08');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,this.radius,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#a86b0a';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#8a570b';ctx.font=`bold ${this.radius}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('$',0,1);ctx.restore()}}
class Sparkle{constructor(){this.x=500+(Math.random()-.5)*480;this.y=245+(Math.random()-.5)*210;this.r=3+Math.random()*7;this.alpha=1;this.decay=.018+Math.random()*.035}update(dt){this.alpha-=this.decay*dt/16.667}draw(){if(this.alpha<=0)return;ctx.save();ctx.globalAlpha=this.alpha;ctx.fillStyle='#fff7c2';ctx.shadowColor='#ffcf47';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fill();ctx.restore()}}
function trigger(){if(playing)return;playing=true;img.classList.remove('play');void img.offsetWidth;img.classList.add('play');setTimeout(()=>{img.classList.remove('play');playing=false},950);for(let i=0;i<26;i++)coins.push(new Coin());for(let i=0;i<24;i++)sparkles.push(new Sparkle());if(!raf){last=performance.now();raf=requestAnimationFrame(loop)}}function loop(now){const dt=Math.min(40,now-last||16.667);last=now;ctx.clearRect(0,0,W,H);for(let i=coins.length-1;i>=0;i--){coins[i].update(dt);coins[i].draw();if(coins[i].alpha<=0)coins.splice(i,1)}for(let i=sparkles.length-1;i>=0;i--){sparkles[i].update(dt);sparkles[i].draw();if(sparkles[i].alpha<=0)sparkles.splice(i,1)}if(coins.length||sparkles.length)raf=requestAnimationFrame(loop);else{raf=0;ctx.clearRect(0,0,W,H)}}button.addEventListener('click',trigger);scene.addEventListener('click',trigger);img.addEventListener('error',()=>{document.querySelector('.hint').textContent='No se pudo cargar la imagen original de la galera.'});})();
</script>
</body>
</html>
