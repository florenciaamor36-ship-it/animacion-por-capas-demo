<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo 02 · Galera animada</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f0f4f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width:100%;
      padding:12px;
    }
    canvas {
      background: transparent;
      cursor: pointer;
    }
    .btn-action {
      background: linear-gradient(135deg, #27ae60, #2ecc71);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 50px;
      box-shadow: 0 8px 15px rgba(46, 204, 113, 0.3);
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .btn-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 20px rgba(46, 204, 113, 0.4);
      background: linear-gradient(135deg, #2ecc71, #27ae60);
    }
    .btn-action:active {
      transform: translateY(1px);
      box-shadow: 0 4px 8px rgba(46, 204, 113, 0.3);
    }
    .hint {
      color: #7f8c8d;
      font-size: 0.95rem;
      text-align:center;
    }
    .back {position:fixed;top:14px;left:14px;color:#2c3e50;text-decoration:none;font-weight:700;background:#ffffffcc;padding:9px 13px;border-radius:999px;box-shadow:0 3px 12px #0002}
  </style>
</head>
<body>

<a class="back" href="../index.html">← Índice</a>
<div class="container">
  <canvas id="slotCanvas" width="500" height="500"></canvas>
  <button class="btn-action" id="triggerBtn">¡Girar / Animar!</button>
  <p class="hint">Haz clic sobre el sombrero o el botón para activar la animación</p>
</div>

<script>
  const canvas = document.getElementById('slotCanvas');
  const ctx = canvas.getContext('2d');
  const triggerBtn = document.getElementById('triggerBtn');

  // Estado de la animación de la galera
  const hat = {
    x: 250,
    baseY: 340,
    y: 340,
    vy: 0,
    gravity: 0.8,
    isJumping: false,
    squishY: 1,
    squishX: 1,
    eyeScaleY: 1,
    laughOffset: 0,
    laughTimer: 0
  };

  // Arreglos para partículas (monedas y destellos)
  let coins = [];
  let sparkles = [];

  // Clase para representar monedas 3D que rebotan y giran
  class Coin {
    constructor(x, y) {
      this.x = x + (Math.random() * 60 - 30);
      this.y = y;
      this.vx = (Math.random() - 0.5) * 12;
      this.vy = -(Math.random() * 10 + 10);
      this.gravity = 0.5;
      this.radius = Math.random() * 6 + 12;
      this.angle = Math.random() * Math.PI * 2;
      this.spinSpeed = (Math.random() - 0.5) * 0.3;
      this.alpha = 1;
      this.bounce = 0.6;
      this.floor = 450;
    }

    update() {
      this.vy += this.gravity;
      this.x += this.vx;
      this.y += this.vy;
      this.angle += this.spinSpeed;

      // Rebote en el suelo
      if (this.y + this.radius > this.floor) {
        this.y = this.floor - this.radius;
        this.vy *= -this.bounce;
        this.vx *= 0.8;
      }

      // Desvanecimiento paulatino
      if (Math.abs(this.vy) < 1 && this.y + this.radius >= this.floor - 2) {
        this.alpha -= 0.02;
      }
    }

    draw(ctx) {
      if (this.alpha <= 0) return;
      ctx.save();
      ctx.globalAlpha = Math.max(0, this.alpha);
      ctx.translate(this.x, this.y);

      // Simulación de rotación 3D en el eje Y
      const scaleX = Math.cos(this.angle);
      ctx.scale(scaleX, 1);

      // Sombra de la moneda
      ctx.fillStyle = '#b7950b';
      ctx.beginPath();
      ctx.arc(2, 2, this.radius, 0, Math.PI * 2);
      ctx.fill();

      // Moneda dorada principal
      const grad = ctx.createLinearGradient(-this.radius, -this.radius, this.radius, this.radius);
      grad.addColorStop(0, '#ffe066');
      grad.addColorStop(0.5, '#f1c40f');
      grad.addColorStop(1, '#d4ac0d');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
      ctx.fill();

      // Borde de la moneda
      ctx.strokeStyle = '#f39c12';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Símbolo $ en la moneda
      ctx.fillStyle = '#b7950b';
      ctx.font = `bold ${this.radius * 1.1}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('$', 0, 1);

      ctx.restore();
    }
  }

  // Clase para destellos dorados
  class Sparkle {
    constructor(x, y) {
      this.x = x + (Math.random() * 80 - 40);
      this.y = y + (Math.random() * 40 - 20);
      this.size = Math.random() * 8 + 4;
      this.alpha = 1;
      this.decay = Math.random() * 0.03 + 0.02;
    }

    update() {
      this.alpha -= this.decay;
    }

    draw(ctx) {
      if (this.alpha <= 0) return;
      ctx.save();
      ctx.globalAlpha = Math.max(0, this.alpha);
      ctx.fillStyle = '#fff7c2';
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  // Función de disparo de animación
  function triggerAction() {
    if (!hat.isJumping) {
      hat.isJumping = true;
      hat.vy = -16;
      hat.squishY = 0.75;
      hat.squishX = 1.25;
      hat.laughTimer = 40;

      // Generar lluvia de monedas doradas
      for (let i = 0; i < 25; i++) {
        coins.push(new Coin(hat.x, hat.y - 120));
      }

      // Generar destellos mágicos
      for (let i = 0; i < 15; i++) {
        sparkles.push(new Sparkle(hat.x, hat.y - 100));
      }
    }
  }

  // Actualización del estado físico de la galera
  function updateHat() {
    if (hat.isJumping) {
      hat.vy += hat.gravity;
      hat.y += hat.vy;

      // Animación suave de risa (movimiento vertical rápido)
      if (hat.laughTimer > 0) {
        hat.laughTimer--;
        hat.laughOffset = Math.sin(hat.laughTimer * 0.8) * 5;
        hat.eyeScaleY = Math.abs(Math.sin(hat.laughTimer * 0.4)) * 0.8 + 0.2; // Parpadeo feliz
      } else {
        hat.laughOffset = 0;
        hat.eyeScaleY = 1;
      }

      // Impacto con el suelo
      if (hat.y >= hat.baseY) {
        hat.y = hat.baseY;
        hat.isJumping = false;
        hat.vy = 0;
        hat.squishY = 0.8;
        hat.squishX = 1.2;
        hat.eyeScaleY = 1;
      }
    }

    // Retorno progresivo a las proporciones originales (Efecto "Squash & Stretch" de Pixar)
    hat.squishY += (1 - hat.squishY) * 0.15;
    hat.squishX += (1 - hat.squishX) * 0.15;
  }

  // Dibujar la galera en 3D/Caricatura estilo Pixar
  function drawHat() {
    ctx.save();
    
    // Posicionamiento de la sombra en el suelo
    const shadowScale = Math.max(0.3, 1 - (hat.baseY - hat.y) / 200);
    ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
    ctx.beginPath();
    ctx.ellipse(hat.x, hat.baseY + 35, 110 * shadowScale, 22 * shadowScale, 0, 0, Math.PI * 2);
    ctx.fill();

    // Traslación y deformación de la galera
    ctx.translate(hat.x, hat.y + hat.laughOffset);
    ctx.scale(hat.squishX, hat.squishY);

    // 1. Ala del sombrero (Base ovalada con volumen 3D)
    const brimGrad = ctx.createLinearGradient(0, -20, 0, 40);
    brimGrad.addColorStop(0, '#27ae60');
    brimGrad.addColorStop(0.7, '#1e8449');
    brimGrad.addColorStop(1, '#145a32');

    ctx.fillStyle = brimGrad;
    ctx.beginPath();
    ctx.ellipse(0, 25, 120, 30, 0, 0, Math.PI * 2);
    ctx.fill();

    // Borde iluminado superior del ala
    ctx.strokeStyle = '#52be80';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(0, 22, 118, 28, 0, Math.PI, Math.PI * 2);
    ctx.stroke();

    // 2. Copa principal de la galera
    const crownGrad = ctx.createLinearGradient(-80, -120, 80, 10);
    crownGrad.addColorStop(0, '#52be80');
    crownGrad.addColorStop(0.3, '#27ae60');
    crownGrad.addColorStop(0.8, '#1e8449');
    crownGrad.addColorStop(1, '#114b27');

    ctx.fillStyle = crownGrad;
    ctx.beginPath();
    ctx.moveTo(-75, 20);
    ctx.bezierCurveTo(-85, -50, -90, -120, -70, -130);
    ctx.bezierCurveTo(-20, -145, 20, -145, 70, -130);
    ctx.bezierCurveTo(90, -120, 85, -50, 75, 20);
    ctx.closePath();
    ctx.fill();

    // Tapa superior del sombrero
    const topGrad = ctx.createRadialGradient(0, -130, 10, 0, -130, 70);
    topGrad.addColorStop(0, '#52be80');
    topGrad.addColorStop(1, '#1e8449');
    ctx.fillStyle = topGrad;
    ctx.beginPath();
    ctx.ellipse(0, -130, 70, 16, 0, 0, Math.PI * 2);
    ctx.fill();

    // 3. Cinta del sombrero (Negra con brillo)
    const beltGrad = ctx.createLinearGradient(-80, 0, 80, 0);
    beltGrad.addColorStop(0, '#1c2833');
    beltGrad.addColorStop(0.5, '#2c3e50');
    beltGrad.addColorStop(1, '#151c24');

    ctx.fillStyle = beltGrad;
    ctx.beginPath();
    ctx.moveTo(-76, 20);
    ctx.bezierCurveTo(-78, -5, -78, -10, -76, -15);
    ctx.bezierCurveTo(-25, -5, 25, -5, 76, -15);
    ctx.bezierCurveTo(78, -10, 78, -5, 76, 20);
    ctx.bezierCurveTo(25, 30, -25, 30, -76, 20);
    ctx.fill();

    // 4. Hebilla dorada brillante 3D
    const buckleGrad = ctx.createLinearGradient(-25, -20, 25, 20);
    buckleGrad.addColorStop(0, '#fff2ac');
    buckleGrad.addColorStop(0.5, '#f1c40f');
    buckleGrad.addColorStop(1, '#9a7d0a');

    ctx.fillStyle = buckleGrad;
    ctx.beginPath();
    ctx.roundRect(-26, -12, 52, 38, 8);
    ctx.fill();

    // Centro oscuro de la hebilla
    ctx.fillStyle = '#1c2833';
    ctx.beginPath();
    ctx.roundRect(-16, -2, 32, 18, 4);
    ctx.fill();

    // 5. Rostro estilo animación (Ojos expresivos y Sonrisa)
    const eyeY = -60;

    // Ojos (Blanco)
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.ellipse(-28, eyeY, 14, 18 * hat.eyeScaleY, 0, 0, Math.PI * 2);
    ctx.ellipse(28, eyeY, 14, 18 * hat.eyeScaleY, 0, 0, Math.PI * 2);
    ctx.fill();

    if (hat.eyeScaleY > 0.3) {
      // Iris (Café brillante / Pixar style)
      ctx.fillStyle = '#6e2c00';
      ctx.beginPath();
      ctx.arc(-26, eyeY + 2, 8, 0, Math.PI * 2);
      ctx.arc(30, eyeY + 2, 8, 0, Math.PI * 2);
      ctx.fill();

      // Pupila
      ctx.fillStyle = '#1b2631';
      ctx.beginPath();
      ctx.arc(-26, eyeY + 2, 4, 0, Math.PI * 2);
      ctx.arc(30, eyeY + 2, 4, 0, Math.PI * 2);
      ctx.fill();

      // Brillo en las pupilas
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(-28, eyeY - 2, 3, 0, Math.PI * 2);
      ctx.arc(28, eyeY - 2, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    // Sonrisa simpática
    ctx.strokeStyle = '#0e3a1d';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    if (hat.isJumping) {
      // Boca abierta al reír
      ctx.fillStyle = '#0e3a1d';
      ctx.arc(0, -32, 16, 0.1 * Math.PI, 0.9 * Math.PI);
      ctx.fill();
    } else {
      // Sonrisa sutil relajada
      ctx.arc(0, -36, 18, 0.2 * Math.PI, 0.8 * Math.PI);
      ctx.stroke();
    }

    // 6. Trébol de la suerte lateral
    drawClover(ctx, 55, -25);

    ctx.restore();
  }

  // Dibujar trébol decorativo
  function drawClover(ctx, x, y) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(0.3);
    ctx.fillStyle = '#2ecc71';

    // Tallos y hojas del trébol
    for (let i = 0; i < 4; i++) {
      ctx.rotate((Math.PI * 2) / 4);
      ctx.beginPath();
      ctx.arc(0, -10, 8, 0, Math.PI * 2);
      ctx.fill();
    }
    // Tallo
    ctx.strokeStyle = '#27ae60';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(5, 15, 10, 22);
    ctx.stroke();

    ctx.restore();
  }

  // Bucle principal de renderizado
  function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    updateHat();

    // Actualizar y renderizar destellos
    sparkles.forEach((s, idx) => {
      s.update();
      s.draw(ctx);
      if (s.alpha <= 0) sparkles.splice(idx, 1);
    });

    drawHat();

    // Actualizar y renderizar monedas
    coins.forEach((c, idx) => {
      c.update();
      c.draw(ctx);
      if (c.alpha <= 0) coins.splice(idx, 1);
    });

    requestAnimationFrame(loop);
  }

  // Event Listeners
  triggerBtn.addEventListener('click', triggerAction);
  canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mouseX = (e.clientX - rect.left) * canvas.width / rect.width;
    const mouseY = (e.clientY - rect.top) * canvas.height / rect.height;

    // Detectar clic dentro de la zona de la galera
    if (Math.abs(mouseX - hat.x) < 120 && Math.abs(mouseY - hat.y) < 140) {
      triggerAction();
    }
  });

  // Iniciar bucle
  loop();
</script>
</body>
</html>
