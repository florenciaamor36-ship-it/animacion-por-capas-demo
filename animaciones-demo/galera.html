<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Demo 02 · Galera animada</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{min-height:100vh;display:grid;place-items:center;padding:52px 14px 22px;background:transparent;color:#24312a}.back{position:fixed;z-index:3;top:14px;left:14px;color:#24312a;text-decoration:none;font-weight:700;background:transparent;padding:9px 13px;border-radius:999px;box-shadow:none}.container{display:flex;flex-direction:column;align-items:center;gap:14px;width:min(100%,680px)}.scene{position:relative;width:min(100%,620px);aspect-ratio:1024/559;overflow:visible;isolation:isolate}.character{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform-origin:50% 82%;user-select:none;-webkit-user-drag:none;filter:none;transform:translateZ(0);backface-visibility:hidden;will-change:transform}.character.play{animation:jump .72s cubic-bezier(.2,.82,.25,1) both}@keyframes jump{0%{transform:translate3d(0,0,0) scale(1,1)}12%{transform:translate3d(0,7px,0) scale(1.06,.91)}34%{transform:translate3d(0,-43px,0) scale(.97,1.05) rotate(-1.2deg)}53%{transform:translate3d(0,-34px,0) scale(1.01,1) rotate(.5deg)}72%{transform:translate3d(0,-10px,0) scale(1.02,.99)}88%{transform:translate3d(0,3px,0) scale(1.04,.94)}95%{transform:translate3d(0,-2px,0) scale(.99,1.02)}100%{transform:translate3d(0,0,0) scale(1,1)}}.particles{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.btn{background:transparent;color:#24312a;border:1px solid #27ae60;padding:14px 28px;font-size:1.05rem;font-weight:800;border-radius:999px;box-shadow:none;cursor:pointer;touch-action:manipulation}.btn:active{transform:translateY(1px)}.hint{margin:0;text-align:center;color:#59655d;font-size:.95rem}.caption{margin:4px 0 0;text-align:center;color:#7b837c;font-size:.8rem}@media(prefers-reduced-motion:reduce){.character.play{animation-duration:1.2s}}
</style>
</head>
<body>
<a class="back" href="../index.html">← Índice</a>
<main class="container">
<div class="scene" id="scene" aria-label="Imagen original de la galera de la suerte animada">
<img class="character" id="character" src="galera-original.png" alt="Galera verde de la suerte con ojos, trébol y monedas" draggable="false">
<canvas class="particles" id="particles" aria-hidden="true"></canvas>
</div>
<button class="btn" id="triggerBtn" type="button">¡Girar / Animar!</button>
<p class="hint">Tocá la galera o el botón para hacerla saltar y lanzar monedas.</p>
<p class="caption">Se anima la imagen original que enviaste.</p>
</main>
<script>
(()=>{'use strict';const scene=document.getElementById('scene'),img=document.getElementById('character'),canvas=document.getElementById('particles'),ctx=canvas.getContext('2d'),button=document.getElementById('triggerBtn');const W=1024,H=559;let coins=[],sparkles=[],raf=0,playing=false,last=0;
function size(){const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',size,{passive:true});size();
// Texturas metálicas precalculadas: oro profundo, cantos iluminados y reflejo especular.
const coinFaces=[];for(let face=0;face<8;face++){const c=document.createElement('canvas');c.width=c.height=96;const g=c.getContext('2d'),r=39;g.save();g.translate(48,48);
const shadow=g.createRadialGradient(2,5,22,0,0,44);shadow.addColorStop(0,'#80500a');shadow.addColorStop(.72,'#bd790b');shadow.addColorStop(1,'#fff0a0');g.fillStyle=shadow;g.beginPath();g.arc(0,0,r+2,0,Math.PI*2);g.fill();
const metal=g.createLinearGradient(-32,-34,34,34);metal.addColorStop(0,'#fff9c4');metal.addColorStop(.12,'#fff0a0');metal.addColorStop(.24,'#f8cc39');metal.addColorStop(.43,'#bd7908');metal.addColorStop(.58,'#ffe866');metal.addColorStop(.76,'#e8a90b');metal.addColorStop(.9,'#fff5ab');metal.addColorStop(1,'#9a5c04');g.fillStyle=metal;g.beginPath();g.arc(0,0,r-3,0,Math.PI*2);g.fill();
g.strokeStyle='#fff1a2';g.lineWidth=2.6;g.beginPath();g.arc(0,0,r-5,0,Math.PI*2);g.stroke();g.strokeStyle='#b77908';g.lineWidth=1.3;g.beginPath();g.arc(0,0,r-9,0,Math.PI*2);g.stroke();
// Soft diagonal specular streak, rotated differently on each cached coin face.
g.save();g.rotate(face*Math.PI/4);const shine=g.createLinearGradient(-30,-24,18,16);shine.addColorStop(0,'rgba(255,255,220,0)');shine.addColorStop(.42,'rgba(255,255,230,.12)');shine.addColorStop(.55,'rgba(255,255,245,.78)');shine.addColorStop(.72,'rgba(255,255,220,.16)');shine.addColorStop(1,'rgba(255,255,220,0)');g.fillStyle=shine;g.beginPath();g.ellipse(-3,-4,28,8,0,0,Math.PI*2);g.fill();g.restore();
g.fillStyle='#8f5b06';g.font='bold 47px Georgia,serif';g.textAlign='center';g.textBaseline='middle';g.shadowColor='rgba(255,246,174,.9)';g.shadowBlur=2;g.fillText('$',0,2);g.restore();coinFaces.push(c)}
class Coin{constructor(index){this.x=510+(Math.random()-.5)*175;this.y=142+Math.random()*42;this.vx=(Math.random()-.5)*440;this.vy=-(250+Math.random()*310);this.radius=10+Math.random()*12;this.face=Math.floor(Math.random()*coinFaces.length);this.angle=Math.random()*6.28;this.spin=(Math.random()-.5)*9;this.alpha=1;this.gravity=760;this.drag=.999;this.bounce=.34+Math.random()*.12;this.floor=H-12;this.delay=index*5+Math.random()*180;this.active=false;this.rest=0;this.flash=Math.random()}
update(dt){if(this.delay>0){this.delay-=dt;return}this.active=true;const t=dt/1000;this.vy+=this.gravity*t;this.vx*=Math.pow(this.drag,t*60);this.x+=this.vx*t;this.y+=this.vy*t;this.angle+=this.spin*t;if(this.y+this.radius>this.floor){this.y=this.floor-this.radius;this.vy=-Math.abs(this.vy)*this.bounce;this.vx*=.78;this.rest++;if(Math.abs(this.vy)<65){this.vy=0;this.alpha-=.62*t}}}
draw(){if(!this.active||this.alpha<=0)return;ctx.save();ctx.globalAlpha=Math.max(0,this.alpha);ctx.translate(this.x,this.y);const facing=Math.max(.12,Math.abs(Math.cos(this.angle)));ctx.scale(facing,1);const size=this.radius/39*78;ctx.drawImage(coinFaces[this.face],-size/2,-size/2,size,size);const glint=Math.max(0,Math.sin(this.angle*1.7+this.flash*6));if(glint>.72){ctx.globalAlpha*=glint;ctx.fillStyle='#fffde0';ctx.shadowColor='#fff7ad';ctx.shadowBlur=10;ctx.beginPath();ctx.arc(-size*.2,-size*.25,Math.max(1.5,size*.055),0,Math.PI*2);ctx.fill()}ctx.restore()}}

class Sparkle{constructor(){this.x=500+(Math.random()-.5)*480;this.y=245+(Math.random()-.5)*210;this.r=3+Math.random()*7;this.alpha=1;this.decay=.014+Math.random()*.022}update(dt){this.alpha-=this.decay*dt/16.667}draw(){if(this.alpha<=0)return;ctx.save();ctx.globalAlpha=this.alpha;ctx.fillStyle='#fff7c2';ctx.shadowColor='#ffcf47';ctx.shadowBlur=7;ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fill();ctx.restore()}}
function trigger(){if(playing)return;playing=true;img.classList.remove('play');void img.offsetWidth;img.classList.add('play');setTimeout(()=>{img.classList.remove('play');playing=false},760);for(let i=0;i<90;i++)coins.push(new Coin(i));for(let i=0;i<36;i++)sparkles.push(new Sparkle());if(!raf){last=performance.now();raf=requestAnimationFrame(loop)}}function loop(now){const dt=Math.min(33,now-last||16.667);last=now;ctx.clearRect(0,0,W,H);for(let i=coins.length-1;i>=0;i--){coins[i].update(dt);coins[i].draw();if(coins[i].alpha<=0)coins.splice(i,1)}for(let i=sparkles.length-1;i>=0;i--){sparkles[i].update(dt);sparkles[i].draw();if(sparkles[i].alpha<=0)sparkles.splice(i,1)}if(coins.length||sparkles.length)raf=requestAnimationFrame(loop);else{raf=0;ctx.clearRect(0,0,W,H)}}button.addEventListener('click',trigger);scene.addEventListener('click',trigger);img.addEventListener('error',()=>{document.querySelector('.hint').textContent='No se pudo cargar la imagen original de la galera.'});})();
</script>
</body>
</html>
