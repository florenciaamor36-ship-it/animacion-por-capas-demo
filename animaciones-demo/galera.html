<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Demo 02 · Galera animada</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{min-height:100vh;display:grid;place-items:center;padding:52px 14px 22px;background:transparent;color:#24312a}.back{position:fixed;z-index:3;top:14px;left:14px;color:#24312a;text-decoration:none;font-weight:700;background:transparent;padding:9px 13px;border-radius:999px;box-shadow:none}.container{display:flex;flex-direction:column;align-items:center;gap:14px;width:min(100%,680px)}.scene{position:relative;width:min(100%,620px);aspect-ratio:1024/559;overflow:visible;isolation:isolate}.character{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform-origin:50% 82%;user-select:none;-webkit-user-drag:none;filter:none;transform:translateZ(0);backface-visibility:hidden;will-change:transform}.character.play{animation:jump .72s cubic-bezier(.2,.82,.25,1) both}@keyframes jump{0%{transform:translate3d(0,0,0) scale(1,1)}14%{transform:translate3d(0,5px,0) scale(1.04,.95)}42%{transform:translate3d(0,-48px,0) scale(.97,1.06) rotate(-1.5deg)}68%{transform:translate3d(0,-18px,0) scale(1.02,.99) rotate(1deg)}84%{transform:translate3d(0,3px,0) scale(1.035,.96)}93%{transform:translate3d(0,-4px,0) scale(.995,1.01)}100%{transform:translate3d(0,0,0) scale(1,1)}}.particles{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.btn{background:transparent;color:#24312a;border:1px solid #27ae60;padding:14px 28px;font-size:1.05rem;font-weight:800;border-radius:999px;box-shadow:none;cursor:pointer;touch-action:manipulation}.btn:active{transform:translateY(1px)}.hint{margin:0;text-align:center;color:#59655d;font-size:.95rem}.caption{margin:4px 0 0;text-align:center;color:#7b837c;font-size:.8rem}@media(prefers-reduced-motion:reduce){.character.play{animation-duration:1.2s}}
</style>
</head>
<body>
<a class="back" href="../index.html">← Índice</a>
<main class="container">
<div class="scene" id="scene" aria-label="Imagen original de la galera de la suerte animada">
<img class="character" id="character" src="galera-original.png" alt="Galera verde de la suerte con ojos, trébol y monedas" draggable="false">
<canvas class="particles" id="particles" aria-hidden="true"></canvas>
</div>
<button class="btn" id="triggerBtn" type="button">¡Girar / Animar!</button>
<p class="hint">Tocá la galera o el botón para hacerla saltar y lanzar monedas.</p>
<p class="caption">Se anima la imagen original que enviaste.</p>
</main>
<script>
(()=>{'use strict';const scene=document.getElementById('scene'),img=document.getElementById('character'),canvas=document.getElementById('particles'),ctx=canvas.getContext('2d'),button=document.getElementById('triggerBtn');const W=1024,H=559;let coins=[],sparkles=[],raf=0,playing=false,last=0;
function size(){const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',size,{passive:true});size();
const coinFaces=[];for(let face=0;face<4;face++){const c=document.createElement('canvas');c.width=c.height=48;const g=c.getContext('2d'),r=20;const grad=g.createLinearGradient(-r,-r,r,r);grad.addColorStop(0,'#fff0a0');grad.addColorStop(.48,'#f3c52d');grad.addColorStop(1,'#a96a08');g.fillStyle=grad;g.beginPath();g.arc(24,24,r,0,Math.PI*2);g.fill();g.strokeStyle='#a86a08';g.lineWidth=2;g.stroke();g.fillStyle='#8a570b';g.font='bold 24px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('$',24,25);coinFaces.push(c)}
class Coin{constructor(){this.x=510+(Math.random()-.5)*320;this.y=135+Math.random()*70;this.vx=(Math.random()-.5)*12;this.vy=-(Math.random()*9+8);this.radius=9+Math.random()*9;this.face=Math.floor(Math.random()*coinFaces.length);this.angle=Math.random()*6.28;this.spin=(Math.random()-.5)*.3;this.alpha=1;this.gravity=.2;this.bounce=.52;this.floor=H-10}update(dt){const t=dt/16.667;this.vy+=this.gravity*t;this.x+=this.vx*t;this.y+=this.vy*t;this.angle+=this.spin*t;if(this.y+this.radius>this.floor){this.y=this.floor-this.radius;this.vy*=-this.bounce;this.vx*=.88;if(Math.abs(this.vy)<1.1){this.vy=0;this.alpha-=.018*t}}}draw(){if(this.alpha<=0)return;ctx.save();ctx.globalAlpha=this.alpha;ctx.translate(this.x,this.y);ctx.scale(Math.max(.08,Math.abs(Math.cos(this.angle))),1);const size=this.radius/20*48;ctx.drawImage(coinFaces[this.face],-size/2,-size/2,size,size);ctx.restore()} }
class Sparkle{constructor(){this.x=500+(Math.random()-.5)*480;this.y=245+(Math.random()-.5)*210;this.r=3+Math.random()*7;this.alpha=1;this.decay=.014+Math.random()*.022}update(dt){this.alpha-=this.decay*dt/16.667}draw(){if(this.alpha<=0)return;ctx.save();ctx.globalAlpha=this.alpha;ctx.fillStyle='#fff7c2';ctx.shadowColor='#ffcf47';ctx.shadowBlur=7;ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fill();ctx.restore()}}
function trigger(){if(playing)return;playing=true;img.classList.remove('play');void img.offsetWidth;img.classList.add('play');setTimeout(()=>{img.classList.remove('play');playing=false},760);for(let i=0;i<90;i++)coins.push(new Coin());for(let i=0;i<36;i++)sparkles.push(new Sparkle());if(!raf){last=performance.now();raf=requestAnimationFrame(loop)}}function loop(now){const dt=Math.min(32,now-last||16.667);last=now;ctx.clearRect(0,0,W,H);for(let i=coins.length-1;i>=0;i--){coins[i].update(dt);coins[i].draw();if(coins[i].alpha<=0)coins.splice(i,1)}for(let i=sparkles.length-1;i>=0;i--){sparkles[i].update(dt);sparkles[i].draw();if(sparkles[i].alpha<=0)sparkles.splice(i,1)}if(coins.length||sparkles.length)raf=requestAnimationFrame(loop);else{raf=0;ctx.clearRect(0,0,W,H)}}button.addEventListener('click',trigger);scene.addEventListener('click',trigger);img.addEventListener('error',()=>{document.querySelector('.hint').textContent='No se pudo cargar la imagen original de la galera.'});})();
</script>
</body>
</html>
