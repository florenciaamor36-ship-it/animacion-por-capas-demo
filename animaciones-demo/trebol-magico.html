<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Demo 05 · Trébol Mágico</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif}body{min-height:100vh;display:grid;place-items:center;padding:48px 16px;background:#120024;color:#fff}.back{position:fixed;top:14px;left:14px;color:#fff1bd;text-decoration:none;font-weight:bold;padding:9px 13px;border:1px solid #ffd70066;border-radius:999px;background:#1c0b30}.stage{display:flex;flex-direction:column;align-items:center;gap:24px}.symbol-container{position:relative;width:150px;height:150px;display:flex;justify-content:center;align-items:center;perspective:700px}.clover-symbol{width:100%;height:100%;object-fit:contain;transform-style:preserve-3d;filter:drop-shadow(0 0 0 rgba(255,215,0,0));}.animate-win{animation:cloverWin 1.8s cubic-bezier(.175,.885,.32,1.275) forwards}@keyframes cloverWin{0%{transform:scale(1) rotateY(0deg);filter:drop-shadow(0 0 0 rgba(255,215,0,0))}40%{transform:scale(1.2) rotateY(360deg);filter:drop-shadow(0 0 10px rgba(255,215,0,.4))}70%{transform:scale(1.5) rotateY(720deg);filter:drop-shadow(0 0 25px rgba(255,215,0,.8))}85%{transform:scale(1.35) rotateY(720deg);filter:drop-shadow(0 0 35px rgba(255,215,0,1))}100%{transform:scale(1.4) rotateY(720deg);filter:drop-shadow(0 0 20px #ffd700) drop-shadow(0 0 40px #ffae00) brightness(1.25)}}.btn-play{margin-top:26px;padding:12px 24px;font-size:16px;font-weight:bold;color:#fff;background:linear-gradient(180deg,#ffd700,#ff8c00);border:0;border-radius:25px;cursor:pointer;box-shadow:0 4px 15px rgba(255,215,0,.4)}.btn-play:active{transform:scale(.95)}.hint{margin:0;color:#dfd0f2;text-align:center;font-size:.9rem;line-height:1.5}@media(prefers-reduced-motion:reduce){.animate-win{animation-duration:.01ms}}
</style>
</head>
<body><a class="back" href="../index.html">← Índice</a><main class="stage"><div class="symbol-container"><img id="clover" src="trebol-magico/trebol.png?v=magico-clean-2" alt="Trébol Mágico recortado de la imagen original" class="clover-symbol"></div><button class="btn-play" id="play" type="button">¡Probar Ganancia!</button><p class="hint">Giro 3D, zoom con rebote y resplandor dorado.<br>Al terminar queda iluminado; tocá el botón para repetir.</p></main><script>(()=>{'use strict';const clover=document.getElementById('clover'),button=document.getElementById('play');function triggerAnimation(){clover.classList.remove('animate-win');void clover.offsetWidth;clover.classList.add('animate-win')}button.addEventListener('click',triggerAnimation)})();</script></body></html>
