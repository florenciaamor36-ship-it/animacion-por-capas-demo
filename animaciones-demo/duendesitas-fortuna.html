<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Demo 05 · Duendesitas de la Fortuna</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#1a002c;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.game{position:relative;width:100vw;height:100vh;height:100dvh;display:flex;justify-content:center;align-items:center;overflow:hidden;background:#1a002c}.game-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:1}#fireflies{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}.back{position:fixed;z-index:4;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));color:#fff5c9;text-decoration:none;font-weight:750;padding:9px 13px;border:1px solid #f8d87988;border-radius:999px;background:#1a002c66;backdrop-filter:blur(4px)}.toggle{position:fixed;z-index:4;right:max(12px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));border:1px solid #ffdb72;color:#fff4c7;background:#210b35c9;padding:10px 16px;border-radius:999px;font-size:.9rem;font-weight:800;cursor:pointer;backdrop-filter:blur(4px)}.toggle[aria-pressed="false"]{opacity:.72}
</style>
</head>
<body><main class="game" aria-label="Demo de luciérnagas sobre Duendesitas de la Fortuna"><img class="game-bg" src="duendesitas-fortuna-fondo.jpg" alt="Arte original de Duendesitas de la Fortuna"><canvas id="fireflies" aria-hidden="true"></canvas><a class="back" href="../index.html">← Índice</a><button class="toggle" id="toggle" aria-pressed="true">Pausar luciérnagas</button></main>
<script>
(()=>{'use strict';const canvas=document.getElementById('fireflies'),ctx=canvas.getContext('2d'),button=document.getElementById('toggle');let w=0,h=0,dpr=1,running=true,last=0,raf=0;const colors=['255, 223, 100','255, 191, 0','212, 255, 120'];const FIREFLY_COUNT=45,flies=[];
function fit(){const r=canvas.getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,2);w=r.width;h=r.height;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);if(flies.length)for(const f of flies){f.x=Math.min(w,Math.max(0,f.x));f.y=Math.min(h,Math.max(0,f.y))}}window.addEventListener('resize',fit,{passive:true});
class Firefly{constructor(){this.reset(true)}reset(initial=false){this.x=Math.random()*w;this.y=Math.random()*h;this.radius=1+Math.random()*2.5;this.alpha=.2+Math.random()*.65;this.phase=Math.random()*Math.PI*2;this.fadeSpeed=.005+Math.random()*.01;this.speedX=(Math.random()-.5)*.6;this.speedY=(Math.random()-.5)*.6;this.color=colors[Math.floor(Math.random()*colors.length)];if(!initial){if(Math.random()<.5)this.x=this.speedX>0?0:w;else this.y=this.speedY>0?0:h}}update(dt){const scale=dt/16.667;this.x+=this.speedX*scale;this.y+=this.speedY*scale;this.phase+=this.fadeSpeed*scale;this.alpha=.12+.82*(.5+.5*Math.sin(this.phase));if(this.x< -5||this.x>w+5||this.y< -5||this.y>h+5)this.reset()}draw(){ctx.save();ctx.shadowBlur=this.radius*4;ctx.shadowColor=`rgba(${this.color},${this.alpha})`;ctx.beginPath();ctx.arc(this.x,this.y,this.radius,0,Math.PI*2);ctx.fillStyle=`rgba(${this.color},${this.alpha})`;ctx.fill();ctx.restore()}}
function frame(now){if(!running){raf=0;return}const dt=Math.min(40,now-last||16.667);last=now;ctx.clearRect(0,0,w,h);for(const f of flies){f.update(dt);f.draw()}raf=requestAnimationFrame(frame)}function play(){running=true;button.textContent='Pausar luciérnagas';button.setAttribute('aria-pressed','true');last=performance.now();if(!raf)raf=requestAnimationFrame(frame)}function pause(){running=false;button.textContent='Reanudar luciérnagas';button.setAttribute('aria-pressed','false');if(raf)cancelAnimationFrame(raf);raf=0;ctx.clearRect(0,0,w,h)}button.addEventListener('click',()=>running?pause():play());fit();for(let i=0;i<FIREFLY_COUNT;i++)flies.push(new Firefly());play()})();
</script></body></html>
